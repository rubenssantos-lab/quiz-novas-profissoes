<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1230">
<meta name="description" content="Quiz: descubra qual profissão de IA combina com você. 6 perguntas rápidas, 1 minuto.">
<title>Qual profissão de IA combina com você?</title>
<!-- Ícone embutido (sem requisição de rede) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
/* =========================================================
   ESTILOS
   ========================================================= */
:root{
  --bg1:#0a1230; --bg2:#14105a; --card:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.14); --text:#f4f7ff; --muted:#b9c3e6;
  --cyan:#22e4ff; --violet:#9b6bff; --radius:20px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --t:250ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  background:#0a1230 radial-gradient(1200px 700px at 10% -10%,#1d2a7a 0%,transparent 60%),
             radial-gradient(900px 600px at 110% 110%,#3a1a7a 0%,transparent 60%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  min-height:100vh;min-height:100dvh;
  font-size:clamp(18px,2.4vw + 10px,26px);
  line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:760px;margin:0 auto;padding:24px 16px 40px;min-height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;justify-content:center;gap:20px}
.screen.active{display:flex;animation:enter var(--t) ease-out}
.screen.leaving{display:flex;animation:leave var(--t) ease-in forwards}
@keyframes enter{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes leave{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-24px)}}

h1{font-size:clamp(32px,6vw + 12px,56px);line-height:1.1;text-align:center;
   background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(24px,3.5vw + 12px,38px);line-height:1.2}
.sub{text-align:center;color:var(--muted);font-size:1.05em}
.hero{font-size:clamp(72px,18vw,120px);text-align:center;filter:drop-shadow(0 0 24px rgba(34,228,255,.45))}

/* Botões */
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{
  min-height:56px;padding:14px 22px;border-radius:var(--radius);font-weight:700;
  transition:transform 120ms,box-shadow var(--t),background var(--t);
}
.btn-primary{background:linear-gradient(90deg,var(--cyan),var(--violet));color:#081030;font-size:1.15em;
  box-shadow:0 8px 24px rgba(155,107,255,.45);width:100%;max-width:420px;align-self:center;min-height:68px}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{color:var(--muted);border:2px solid var(--line);background:transparent;align-self:flex-start;font-size:.85em;padding:10px 18px}
:focus-visible{outline:4px solid var(--cyan);outline-offset:3px}

/* Progresso */
.progress-label{color:var(--muted);font-weight:600}
.bar{height:12px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width var(--t) ease}

/* Respostas */
.answers{display:grid;gap:14px}
.answer{
  min-height:64px;text-align:left;padding:16px 20px;border-radius:var(--radius);
  background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);
  display:flex;gap:14px;align-items:center;font-weight:600;
  transition:background var(--t),border-color var(--t),transform 150ms;
}
.answer .letter{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(34,228,255,.15);color:var(--cyan);font-weight:800}
.answer:hover{border-color:var(--cyan)}
.answer.chosen{background:linear-gradient(90deg,rgba(34,228,255,.25),rgba(155,107,255,.3));border-color:var(--cyan);transform:scale(1.02)}

/* Resultado */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.result-head{text-align:center}
.result-head h2{margin-top:6px}
.tagline{color:var(--cyan);font-weight:700;font-size:1.1em;margin-top:8px}
.card h3{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--violet);margin-bottom:6px;filter:brightness(1.3)}
.second{text-align:center;color:var(--muted)}
.second strong{color:var(--text)}
.footer-msg{text-align:center;font-weight:800;font-size:1.05em;padding:16px;border-radius:var(--radius);
  background:linear-gradient(90deg,rgba(34,228,255,.15),rgba(155,107,255,.2));border:1px solid var(--line)}
.idle{text-align:center;color:var(--muted);font-size:.7em}

/* Tabela do modo de teste */
.test{font-size:.7em;overflow-x:auto}
.test table{width:100%;border-collapse:collapse}
.test th,.test td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}

/* Confete (canvas) */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .screen.leaving{display:none}
}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main>
  <!-- TELA 1: INÍCIO -->
  <section id="tela-inicio" class="screen active" aria-labelledby="titulo">
    <div class="hero" aria-hidden="true">🤖✨</div>
    <h1 id="titulo">Qual profissão de IA combina com você?</h1>
    <p class="sub">6 perguntas rápidas, 1 minuto</p>
    <p class="sub" style="font-size:.85em">A IA está criando carreiras novas — e quem aprende a usá-la bem vai longe!</p>
    <button class="btn btn-primary" id="btn-comecar">Começar</button>
  </section>

  <!-- TELA 2: PERGUNTAS -->
  <section id="tela-pergunta" class="screen" aria-labelledby="pergunta-texto">
    <button class="btn btn-ghost" id="btn-voltar">← Voltar</button>
    <div>
      <p class="progress-label" id="progresso-texto">Pergunta 1 de 6</p>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="1" id="barra"><span></span></div>
    </div>
    <h2 id="pergunta-texto" tabindex="-1"></h2>
    <div class="answers" id="respostas"></div>
  </section>

  <!-- TELA 3: RESULTADO -->
  <section id="tela-resultado" class="screen" aria-labelledby="res-nome">
    <div id="resultado" aria-live="polite" aria-atomic="true"></div>
    <button class="btn btn-primary" id="btn-refazer">Refazer o quiz</button>
    <p class="idle">Esta tela volta ao início sozinha após 60 segundos.</p>
    <div id="teste" class="test card" hidden></div>
  </section>
</main>

<script>
/* =========================================================
   1) DADOS — edite aqui perguntas, pontos e profissões
   ========================================================= */

// Ordem fixa usada no último critério de desempate
const ORDEM = ["EIA", "EP", "CD", "AE", "AF", "DC"];

const PROFISSOES = {
  EIA: { nome: "Engenheiro de IA", emoji: "🤖",
    frase: "Você constrói as ferramentas do futuro.",
    faz: "Constrói sistemas de IA e os conecta a aplicativos.",
    combina: "Você gosta de lógica, de construir e de ver as coisas funcionando.",
    comecar: "Aprender lógica de programação e Python." },
  EP: { nome: "Engenheiro de Prompt", emoji: "💬",
    frase: "Você sabe pedir e faz da IA uma parceira.",
    faz: "Pede à IA do jeito certo para obter bons resultados.",
    combina: "Você se comunica bem, é curioso e gosta de testar ideias.",
    comecar: "Praticar pedidos claros (Papel, Tarefa, Contexto e Formato) e comparar as respostas." },
  CD: { nome: "Treinador e Curador de Dados", emoji: "📊",
    frase: "Você ensina a IA com informação de qualidade.",
    faz: "Escolhe e organiza os dados que ensinam a IA.",
    combina: "Você é organizado, detalhista e gosta de pesquisar.",
    comecar: "Aprender planilhas e a organizar informações." },
  AE: { nome: "Auditor de Ética e Segurança em IA", emoji: "🛡️",
    frase: "Você garante uma IA justa e segura para todos.",
    faz: "Verifica se a IA é justa, segura e sem preconceito.",
    combina: "Você liga para justiça, questiona e quer proteger as pessoas.",
    comecar: "Treinar o pensamento crítico e conhecer a proteção de dados." },
  AF: { nome: "Especialista em Automação de Fluxos", emoji: "⚙️",
    frase: "Você faz o trabalho chato rodar sozinho.",
    faz: "Faz tarefas repetitivas rodarem sozinhas e define quando chamar uma pessoa.",
    combina: "Você é prático e adora ganhar tempo.",
    comecar: "Aprender lógica e ferramentas de automação." },
  DC: { nome: "Diretor Criativo de IA Generativa", emoji: "🎨",
    frase: "Você dá vida a ideias que antes só cabiam na imaginação.",
    faz: "Dirige a IA para criar imagens, textos e vídeos e decide o que ficou bom.",
    combina: "Você é criativo, tem bom gosto e muitas ideias.",
    comecar: "Desenvolver bom gosto e contar boas histórias." }
};

// Cada resposta: texto, quem ganha +2 (p2) e quem ganha +1 (p1)
const PERGUNTAS = [
  { texto: "Em um trabalho em grupo, qual papel você costuma assumir?", respostas: [
    { texto: "Monto a estrutura e faço tudo funcionar.", p2: "EIA", p1: "AF" },
    { texto: "Dou as ideias e cuido do visual.", p2: "DC", p1: "EP" },
    { texto: "Pesquiso e organizo as informações.", p2: "CD", p1: "AE" },
    { texto: "Reviso para ver se está tudo certo e justo.", p2: "AE", p1: "CD" } ] },
  { texto: "O que você mais curte fazer no tempo livre?", respostas: [
    { texto: "Jogos de lógica ou mexer com programação.", p2: "EIA", p1: "AF" },
    { texto: "Desenhar, editar vídeos, criar músicas ou histórias.", p2: "DC", p1: "EP" },
    { texto: "Conversar e explicar as coisas com clareza.", p2: "EP", p1: "DC" },
    { texto: "Descobrir atalhos e truques para fazer tudo mais rápido.", p2: "AF", p1: "EIA" } ] },
  { texto: "Apareceu uma tarefa repetitiva e chata. O que você faz?", respostas: [
    { texto: "Organizo tudo em listas e tabelas até ficar fácil.", p2: "CD", p1: "AF" },
    { texto: "Pergunto se é justo e seguro fazer desse jeito.", p2: "AE", p1: "CD" },
    { texto: "Descubro como pedir a ajuda certa (de uma pessoa ou de uma IA).", p2: "EP", p1: "DC" },
    { texto: "Faço um jeito de ela rodar sozinha.", p2: "AF", p1: "EIA" } ] },
  { texto: "Qual destes desafios mais te anima?", respostas: [
    { texto: "Criar um aplicativo que usa IA.", p2: "EIA", p1: "CD" },
    { texto: "Produzir um vídeo ou cartaz incrível com ajuda da IA.", p2: "DC", p1: "EP" },
    { texto: "Montar uma coleção de bons exemplos para ensinar a IA.", p2: "CD", p1: "EIA" },
    { texto: "Descobrir o pedido perfeito para a IA dar uma resposta incrível.", p2: "EP", p1: "DC" } ] },
  { texto: "O que mais pesa quando você toma uma decisão?", respostas: [
    { texto: "Se ela trata todo mundo com justiça.", p2: "AE", p1: "CD" },
    { texto: "Se vai ficar bonita e emocionar.", p2: "DC", p1: "EP" },
    { texto: "Se as informações estão corretas e organizadas.", p2: "CD", p1: "AE" },
    { texto: "Se vai poupar tempo de todo mundo.", p2: "AF", p1: "EIA" } ] },
  { texto: "Escolha um projeto para fazer na escola:", respostas: [
    { texto: "Um robô que responde às dúvidas dos colegas.", p2: "EIA", p1: "AF" },
    { texto: "Um guia de regras para usar a IA sem riscos.", p2: "AE", p1: "CD" },
    { texto: "Um roteiro de estudos com as perguntas certas para a IA.", p2: "EP", p1: "DC" },
    { texto: "Um sistema que envia lembretes e avisos da turma sozinho.", p2: "AF", p1: "EIA" } ] }
];

const MSG_RODAPE = "Quem aprende a usar IA hoje sai na frente amanhã.";
const TEMPO_INATIVIDADE_MS = 60000;

/* =========================================================
   2) LÓGICA DE PONTUAÇÃO (sempre recalculada do zero)
   ========================================================= */

// respostas = array com o índice (0-3) escolhido em cada pergunta
function calcularPlacar(respostas) {
  const placar = {};
  ORDEM.forEach(c => placar[c] = { codigo: c, total: 0, vezes2: 0, ultimo2: -1 });
  respostas.forEach((ri, qi) => {
    if (ri == null) return;
    const r = PERGUNTAS[qi].respostas[ri];
    placar[r.p2].total += 2;
    placar[r.p2].vezes2 += 1;
    placar[r.p2].ultimo2 = Math.max(placar[r.p2].ultimo2, qi);
    placar[r.p1].total += 1;
  });
  return placar;
}

// Ordena: total > mais +2 > +2 mais recente > ordem fixa
function classificar(placar) {
  return ORDEM.map(c => placar[c]).sort((a, b) =>
    (b.total - a.total) ||
    (b.vezes2 - a.vezes2) ||
    (b.ultimo2 - a.ultimo2) ||
    (ORDEM.indexOf(a.codigo) - ORDEM.indexOf(b.codigo))
  );
}

/* =========================================================
   3) TELAS E INTERAÇÃO
   ========================================================= */
const $ = id => document.getElementById(id);
const reduzMovimento = matchMedia("(prefers-reduced-motion: reduce)").matches;
const modoTeste = new URLSearchParams(location.search).get("teste") === "1";

let respostas = [];   // estado único do quiz
let atual = 0;        // pergunta atual
let travado = false;  // evita clique duplo durante a animação
let timerInatividade = null;

function mostrarTela(id) {
  const ativa = document.querySelector(".screen.active");
  const nova = $(id);
  if (ativa && ativa !== nova && !reduzMovimento) {
    ativa.classList.remove("active");
    ativa.classList.add("leaving");
    setTimeout(() => ativa.classList.remove("leaving"), 250);
    setTimeout(() => ativar(nova), 250);
  } else {
    if (ativa) ativa.classList.remove("active");
    ativar(nova);
  }
}
function ativar(el) {
  el.classList.remove("active"); void el.offsetWidth; // reinicia animação
  el.classList.add("active");
  window.scrollTo(0, 0);
}

function iniciar() {
  respostas = new Array(PERGUNTAS.length).fill(null);
  atual = 0;
  renderPergunta();
  mostrarTela("tela-pergunta");
}

function renderPergunta() {
  const q = PERGUNTAS[atual];
  const n = PERGUNTAS.length;
  $("progresso-texto").textContent = `Pergunta ${atual + 1} de ${n}`;
  $("barra").setAttribute("aria-valuenow", atual + 1);
  $("barra").firstElementChild.style.width = ((atual + 1) / n * 100) + "%";
  $("pergunta-texto").textContent = q.texto;
  $("btn-voltar").textContent = atual === 0 ? "← Início" : "← Voltar";

  const box = $("respostas");
  box.innerHTML = "";
  q.respostas.forEach((r, i) => {
    const b = document.createElement("button");
    b.className = "answer" + (respostas[atual] === i ? " chosen" : "");
    b.innerHTML = `<span class="letter" aria-hidden="true">${"ABCD"[i]}</span><span></span>`;
    b.lastChild.textContent = r.texto;
    b.setAttribute("aria-pressed", respostas[atual] === i);
    b.addEventListener("click", () => escolher(i, b));
    box.appendChild(b);
  });
  travado = false;
  // foco na pergunta para leitores de tela / teclado
  setTimeout(() => $("pergunta-texto").focus({ preventScroll: true }), reduzMovimento ? 0 : 260);
}

function escolher(i, botao) {
  if (travado) return;
  travado = true;
  respostas[atual] = i;
  document.querySelectorAll(".answer").forEach(b => { b.classList.remove("chosen"); b.setAttribute("aria-pressed", "false"); });
  botao.classList.add("chosen"); botao.setAttribute("aria-pressed", "true");
  setTimeout(() => {
    if (atual < PERGUNTAS.length - 1) {
      atual++;
      renderPergunta();
      mostrarTela("tela-pergunta");
    } else {
      mostrarResultado();
    }
  }, reduzMovimento ? 120 : 380);
}

function voltar() {
  if (atual === 0) { mostrarTela("tela-inicio"); return; }
  atual--;
  renderPergunta();
  mostrarTela("tela-pergunta");
}

function mostrarResultado() {
  const placar = calcularPlacar(respostas);
  const ranking = classificar(placar);
  const p = PROFISSOES[ranking[0].codigo];
  const s = PROFISSOES[ranking[1].codigo];

  $("resultado").innerHTML = `
    <div class="result-head">
      <div class="hero" aria-hidden="true">${p.emoji}</div>
      <p class="sub" style="font-size:.85em">Sua profissão de IA é…</p>
      <h2 id="res-nome">${p.nome}</h2>
      <p class="tagline">${p.frase}</p>
    </div>
    <div class="card" style="margin-top:18px"><h3>O que ela faz</h3><p>${p.faz}</p></div>
    <div class="card" style="margin-top:12px"><h3>Por que combina com você</h3><p>${p.combina}</p></div>
    <div class="card" style="margin-top:12px"><h3>Para começar já</h3><p>${p.comecar}</p></div>
    <p class="second" style="margin-top:16px">Você também combina com: <strong>${s.emoji} ${s.nome}</strong></p>
    <p class="footer-msg" style="margin-top:16px">${MSG_RODAPE}</p>`;

  const t = $("teste");
  if (modoTeste) {
    t.hidden = false;
    t.innerHTML = `<p><strong>Modo de teste</strong> — respostas: ${respostas.map(r => "ABCD"[r]).join(", ")}</p>
      <table><thead><tr><th>#</th><th>Profissão</th><th>Total</th><th>Vezes +2</th><th>Último +2 (pergunta)</th></tr></thead><tbody>
      ${ranking.map((r, i) => `<tr><td>${i + 1}</td><td>${r.codigo}</td><td>${r.total}</td><td>${r.vezes2}</td><td>${r.ultimo2 >= 0 ? r.ultimo2 + 1 : "—"}</td></tr>`).join("")}
      </tbody></table>`;
  } else { t.hidden = true; }

  mostrarTela("tela-resultado");
  setTimeout(() => $("btn-refazer").focus({ preventScroll: true }), 300);
  confete();
  armarInatividade();
}

function refazer() {
  desarmarInatividade();
  respostas = []; atual = 0;
  $("resultado").innerHTML = "";
  mostrarTela("tela-inicio");
  setTimeout(() => $("btn-comecar").focus({ preventScroll: true }), 300);
}

/* Volta ao início após 60s sem interação na tela de resultado */
function armarInatividade() {
  desarmarInatividade();
  timerInatividade = setTimeout(refazer, TEMPO_INATIVIDADE_MS);
}
function desarmarInatividade() { clearTimeout(timerInatividade); timerInatividade = null; }
["pointerdown", "keydown", "scroll", "touchstart"].forEach(ev =>
  addEventListener(ev, () => { if (timerInatividade) armarInatividade(); }, { passive: true }));

/* Confete simples em canvas (desligado com prefers-reduced-motion) */
function confete() {
  if (reduzMovimento) return;
  const c = $("confetti"), ctx = c.getContext("2d");
  const dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cores = ["#22e4ff", "#9b6bff", "#ffffff", "#ffd166", "#ff6bd6"];
  const ps = Array.from({ length: 120 }, () => ({
    x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .5,
    vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3,
    r: 4 + Math.random() * 5, a: Math.random() * 6, cor: cores[Math.random() * cores.length | 0]
  }));
  const fim = performance.now() + 3000;
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.a += .1;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.cor; ctx.globalAlpha = Math.max(0, (fim - t) / 1000);
      ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    });
    if (t < fim) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(performance.now());
}

$("btn-comecar").addEventListener("click", iniciar);
$("btn-voltar").addEventListener("click", voltar);
$("btn-refazer").addEventListener("click", refazer);
</script>
</body>
</html>
